name: Validate C++

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-cpp.yml'
      - 'packages/react-native-filament/cpp/**'
      - 'packages/react-native-filament/android/src/main/cpp/**'
      - 'packages/react-native-filament/ios/src/**'
  pull_request:
    paths:
      - '.github/workflows/validate-cpp.yml'
      - 'packages/react-native-filament/cpp/**'
      - 'packages/react-native-filament/android/src/main/cpp/**'
      - 'packages/react-native-filament/ios/src/**'

jobs:
  lint:
    name: Check clang-format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - 'packages/react-native-filament/cpp'
          - 'packages/react-native-filament/android/src/main/cpp'
          - 'packages/react-native-filament/ios/src'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run clang-format style check
        uses: mrousavy/clang-format-action@v1
        with:
          clang-format-version: '16'
          check-path: ${{ matrix.path }}
          clang-format-style-path: packages/react-native-filament/cpp/.clang-format

