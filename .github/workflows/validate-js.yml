name: Validate JS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Typecheck, lint and spec drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: No node_modules outside the root
        run: test -z "$(find . -mindepth 2 -name node_modules -type d -not -path './node_modules/*')"

      - name: Typecheck library
        working-directory: packages/react-native-filament
        run: bun run typecheck

      - name: Typecheck example
        working-directory: apps/example
        run: bunx tsc --noEmit -p .

      - name: Lint library
        working-directory: packages/react-native-filament
        run: bun run lint

      - name: Generated Nitro code is up to date
        working-directory: packages/react-native-filament
        run: |
          bun run specs
          git diff --exit-code -- nitrogen

      - name: No banned patterns
        run: |
          ! git grep -n -E '\b(setTimeout|setInterval|setImmediate|requestAnimationFrame|InteractionManager)\b|sleep_for|usleep\(|Thread\.sleep|asyncAfter|Task\.sleep|while \(true\)' -- packages/react-native-filament/src packages/react-native-filament/cpp packages/react-native-filament/ios packages/react-native-filament/android/src apps/shared/src ':!:apps/shared/src/benchmarks/BenchmarkOverlay.tsx'
