name: Build Android

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/build-android.yml'
      - 'packages/react-native-filament/cpp/**'
      - 'packages/react-native-filament/android/**'
      - 'packages/react-native-filament/nitrogen/**'
      - 'packages/react-native-filament/filament.json'
      - 'apps/example/android/**'
      - 'bun.lock'

jobs:
  build:
    name: Build example app (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Restore Filament store
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/react-native-filament
          key: filament-android-${{ hashFiles('packages/react-native-filament/filament.json') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Assemble
        working-directory: apps/example/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --console=plain
